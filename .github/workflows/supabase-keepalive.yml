name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Keep Supabase project active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Query public content
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY secret is required}"
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Accept: application/json" \
              "${SUPABASE_URL%/}/rest/v1/site_content?select=key&limit=1"
          )"
          printf '%s' "$response" | jq -e 'type == "array"' >/dev/null
          printf '%s\n' 'Supabase keepalive query succeeded.'
