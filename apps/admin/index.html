<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LifeOS Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:            #080809;
        --bg-raised:     #0e0e11;
        --bg-subtle:     #161619;
        --border:        rgba(255,255,255,0.055);
        --border-strong: rgba(255,255,255,0.11);
        --border-hover:  rgba(255,255,255,0.19);
        --text:          #f0f0f0;
        --text-muted:    #7a7a86;
        --text-faint:    #3e3e48;
        --accent:        #FF5A1F;
        --accent-dim:    rgba(255,90,31,0.09);
        --accent-border: rgba(255,90,31,0.26);
        --accent-glow:   rgba(255,90,31,0.16);
        --green:         #34d399;
        --green-dim:     rgba(52,211,153,0.09);
      }

      html, body { height: 100%; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      ::selection { background: rgba(255,90,31,0.15); color: var(--text); }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: #1e1e26; border-radius: 2px; }

      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea, select { font-family: inherit; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-dot {
        0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
        50%      { box-shadow: 0 0 0 5px transparent; }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
